name: CardWise Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Test & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Type-check All Workspaces
        run: npm run typecheck

      - name: Run Backend, Extension and Dashboard Regression Tests
        run: npm run test

      - name: Build All Workspaces
        run: npm run build

      - name: Verify Compiled Backend Startup and API
        run: node backend/scripts/verify-compiled.cjs

      - name: Verify Disk Persistence and Graceful Restart
        run: node backend/scripts/verify-disk.cjs

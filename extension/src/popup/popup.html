<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardWise Rewards</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-badge">CW</div>
        <div class="header-titles">
          <div class="app-title">CardWise</div>
          <div class="app-subtitle">Smart Rewards Assistant</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="sync-btn" class="icon-btn" title="Sync cards from dashboard">🔄</button>
        <a href="http://localhost:5173" target="_blank" class="icon-btn" title="Open React Dashboard">📊</a>
      </div>
    </header>

    <!-- Nav Tabs -->
    <nav class="tabs">
      <button class="tab-btn active" data-tab="active-tab">Current Tab</button>
      <button class="tab-btn" data-tab="cards-tab">My Cards</button>
      <button class="tab-btn" data-tab="calc-tab">Calculator</button>
    </nav>

    <!-- Tab 1: Current Tab / Active Store Recommendation -->
    <section id="active-tab" class="tab-content active">
      <div class="current-site-bar">
        <span class="site-icon">🌐</span>
        <span id="current-domain-label" class="domain-text">Detecting active tab...</span>
      </div>

      <div id="recommendation-result" class="rec-card">
        <div class="loading-spinner" id="rec-loading">Loading recommendation...</div>
        
        <div id="rec-details" style="display: none;">
          <div class="best-card-banner" id="best-card-banner">
            <div class="card-meta">
              <span id="best-card-name" class="card-name">Prime Rewards Visa</span>
              <span id="best-card-rate" class="rate-badge">5.0%</span>
            </div>
            <div class="card-est-cashback" id="best-card-cashback">+$7.50</div>
            <div class="card-desc" id="best-card-desc">5% cash back at Amazon.com</div>
          </div>

          <div class="amount-calc-bar">
            <span>Amount: $</span>
            <input type="number" id="tab-amount-input" value="150.00" step="5" min="1" class="num-input">
            <button id="tab-amount-refresh" class="btn-primary-sm">Calculate</button>
          </div>

          <div class="alternatives-box" id="alternatives-box">
            <div class="alt-header">Alternative Cards:</div>
            <div id="alternatives-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 2: Synced Cards List -->
    <section id="cards-tab" class="tab-content">
      <div class="cards-header">
        <span>Active Wallet Cards (<span id="card-count">0</span>)</span>
        <a href="http://localhost:5173" target="_blank" class="text-link">+ Add in Dashboard</a>
      </div>
      <div id="cards-list-container" class="cards-list">
        <div class="loading-spinner">Loading cards...</div>
      </div>
    </section>

    <!-- Tab 3: Reward Calculator -->
    <section id="calc-tab" class="tab-content">
      <div class="calc-form">
        <label class="form-label">Merchant / Domain</label>
        <select id="calc-merchant-select" class="form-select">
          <option value="amazon.com">Amazon (online_shopping)</option>
          <option value="bestbuy.com">Best Buy (electronics)</option>
          <option value="target.com">Target (retail)</option>
          <option value="walmart.com">Walmart (groceries)</option>
          <option value="custom">Other / Custom</option>
        </select>

        <label class="form-label" style="margin-top: 10px;">Purchase Amount ($)</label>
        <input type="number" id="calc-amount-input" value="250.00" step="10" min="1" class="form-input">

        <button id="run-calc-btn" class="btn-primary" style="margin-top: 12px; width: 100%;">
          Find Best Card
        </button>

        <div id="calc-result-box" style="margin-top: 12px; display: none;"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span id="sync-status-text">Connected to CardWise Engine</span>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>

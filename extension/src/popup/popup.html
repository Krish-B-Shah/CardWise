<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardWise — Smart Rewards Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Brand Header -->
    <header class="popup-header">
      <div class="brand-lockup">
        <!-- Embedded SVG Mark -->
        <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="#14283F" stroke="#254467"/>
          <path d="M8 11C8 9.89543 8.89543 9 10 9H22C23.1046 9 24 9.89543 24 11V13H8V11Z" fill="#FFFFFF" fill-opacity="0.95"/>
          <path d="M8 15H15V22C15 22.5523 14.5523 23 14 23H10C8.89543 23 8 22.1046 8 21V15Z" fill="#FFFFFF" fill-opacity="0.45"/>
          <path d="M17 23L20.5 16L24 23H17Z" fill="#16866A"/>
          <circle cx="20.5" cy="14" r="1.5" fill="#34D399"/>
        </svg>
        <div class="brand-text">
          <span class="brand-name">Card<span class="brand-accent">Wise</span></span>
          <span class="brand-sub">Rewards Intelligence</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="sync-btn" class="action-btn" title="Sync cards from shared database">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
        </button>
        <a href="http://localhost:5173" target="_blank" class="action-btn" title="Open Full Dashboard">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
        </a>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-bar">
      <button class="nav-btn active" data-tab="active-tab">Active Tab</button>
      <button class="nav-btn" data-tab="cards-tab">Wallet</button>
      <button class="nav-btn" data-tab="calc-tab">Calculator</button>
    </nav>

    <!-- Tab 1: Current Tab Recommendation -->
    <section id="active-tab" class="tab-panel active">
      <div class="merchant-chip-bar">
        <span class="domain-icon">🛍️</span>
        <span id="current-domain-label" class="domain-title">Detecting active tab...</span>
        <span id="merchant-status-badge" class="status-pill">Active</span>
      </div>

      <div id="recommendation-result" class="rec-section">
        <div class="loader-box" id="rec-loading">Analyzing merchant cashback...</div>

        <div id="rec-details" style="display: none;">
          <!-- Highlighted Card Banner -->
          <div class="highlight-card-box" id="best-card-banner">
            <div class="card-issuer-row">
              <span id="best-card-name" class="card-product-title">Prime Rewards Visa</span>
              <span id="best-card-rate" class="cashback-badge">5.0%</span>
            </div>
            <div class="card-cashback-lead" id="best-card-cashback">+$7.50</div>
            <div class="card-rule-caption" id="best-card-desc">5% cash back at Amazon.com</div>
          </div>

          <!-- Quick Calculation Input -->
          <div class="subtotal-input-row">
            <span class="subtotal-label">Subtotal:</span>
            <div class="input-with-symbol">
              <span>$</span>
              <input type="number" id="tab-amount-input" value="150.00" step="5" min="1" class="tabular-input">
            </div>
            <button id="tab-amount-refresh" class="btn-calc">Recalculate</button>
          </div>

          <!-- Alternatives Accordion -->
          <div class="alternatives-card">
            <div class="alt-title-row">Wallet Alternatives</div>
            <div id="alternatives-list" class="alt-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tab 2: Synced Cards List -->
    <section id="cards-tab" class="tab-panel">
      <div class="wallet-header-row">
        <span>Active Wallet Cards (<span id="card-count" class="tabular-nums">0</span>)</span>
        <a href="http://localhost:5173" target="_blank" class="text-cta">+ Add in Dashboard</a>
      </div>
      <div id="cards-list-container" class="wallet-scroll-list">
        <div class="loader-box">Loading cards...</div>
      </div>
    </section>

    <!-- Tab 3: Rewards Calculator -->
    <section id="calc-tab" class="tab-panel">
      <div class="calc-box">
        <label class="field-label">Merchant / Store Domain</label>
        <select id="calc-merchant-select" class="field-select">
          <option value="amazon.com">Amazon (online_shopping)</option>
          <option value="bestbuy.com">Best Buy (electronics)</option>
          <option value="target.com">Target (retail)</option>
          <option value="walmart.com">Walmart (groceries)</option>
          <option value="custom">Other / Custom</option>
        </select>

        <label class="field-label" style="margin-top: 10px;">Purchase Amount ($)</label>
        <input type="number" id="calc-amount-input" value="250.00" step="10" min="1" class="field-input tabular-nums">

        <button id="run-calc-btn" class="btn-primary-action" style="margin-top: 12px; width: 100%;">
          Find Highest Return Card
        </button>

        <div id="calc-result-box" style="margin-top: 12px; display: none;"></div>
      </div>
    </section>

    <!-- Footer Status -->
    <footer class="popup-footer">
      <span id="sync-status-text">Connected to CardWise Engine</span>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
